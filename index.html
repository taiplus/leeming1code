<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hà Văn Tài - Saiyan God Mode</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0;
    font-family: 'Rajdhani', sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    /* Màu nền dự phòng nếu ảnh lỗi */
    background-color: #050505; 
    overflow: hidden;
  }

  /* --- ẢNH NỀN GOKU & VEGETA --- */
  .bg-container {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: -2;
  }

  .background-image {
    width: 100%;
    height: 100%;
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    /* ĐƯỜNG DẪN ẢNH: Nhớ đổi tên file thành goku.jpg trong thư mục images */
    background-image: url('images/goku.jpg');
    
    /* Hiệu ứng zoom nhẹ liên tục */
    animation: zoomEffect 20s infinite alternate;
  }

  @keyframes zoomEffect {
    0% { transform: scale(1); }
    100% { transform: scale(1.1); }
  }

  /* Lớp phủ tối để làm nổi bật chữ */
  .overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.8) 90%);
    z-index: -1;
  }

  /* --- KHUNG THẺ TRONG SUỐT (GLASS) --- */
  .card {
    position: relative;
    width: 400px;
    padding: 40px 20px;
    background: rgba(16, 20, 30, 0.65); /* Màu tối trong suốt */
    backdrop-filter: blur(8px); /* Làm mờ ảnh nền phía sau */
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 0 50px rgba(0, 198, 255, 0.2);
    text-align: center;
    color: white;
    animation: float 4s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }

  /* Hiệu ứng viền sáng chạy quanh thẻ */
  .card::after {
    content: '';
    position: absolute;
    top: -2px; left: -2px; right: -2px; bottom: -2px;
    background: linear-gradient(45deg, #ff0055, #00eaff, #ff0055);
    z-index: -1;
    border-radius: 22px;
    background-size: 400%;
    animation: glowBorder 10s linear infinite;
    opacity: 0.7;
  }
  @keyframes glowBorder { 0% {background-position: 0 0;} 100% {background-position: 400% 0;} }


  /* --- AVATAR --- */
  .avatar-box {
    position: relative;
    width: 140px;
    height: 140px;
    margin: 0 auto 20px auto;
  }

  .avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #fff;
    box-shadow: 0 0 25px #00eaff;
  }

  /* --- TEXT INFO --- */
  .name {
    font-family: 'Orbitron', sans-serif;
    font-size: 32px;
    font-weight: bold;
    text-transform: uppercase;
    text-shadow: 0 0 10px rgba(0, 234, 255, 0.8);
    margin-bottom: 5px;
  }

  .sub-title {
    color: #00eaff;
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 25px;
    font-weight: bold;
  }

  /* --- THANH CHỈ SỐ (HP/MP) --- */
  .stats-container {
    margin-bottom: 25px;
    padding: 0 20px;
  }
  .stat-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #ccc;
    margin-bottom: 5px;
  }
  .bar-bg {
    background: rgba(255,255,255,0.1);
    height: 6px;
    border-radius: 3px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .bar-fill { height: 100%; border-radius: 3px; }
  .hp-fill { width: 90%; background: linear-gradient(90deg, #ff4d4d, #ff0000); box-shadow: 0 0 10px #ff0000; }
  .mp-fill { width: 85%; background: linear-gradient(90deg, #4d94ff, #0066ff); box-shadow: 0 0 10px #0066ff; }

  /* --- 7 VIÊN NGỌC RỒNG 3D --- */
  .dragon-balls {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 30px;
  }

  .ball {
    width: 35px;
    height: 35px;
    border-radius: 50%;
    /* Hiệu ứng cầu thủy tinh cam */
    background: radial-gradient(circle at 30% 30%, #ffd200, #ff8c00, #d65c00);
    box-shadow: 
      inset 2px 2px 5px rgba(255,255,255,0.6),
      0 0 15px rgba(255, 140, 0, 0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #cc0000; /* Màu sao đỏ */
    font-size: 10px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
    user-select: none;
  }

  .ball:hover {
    transform: scale(1.3) rotate(360deg);
    filter: brightness(1.2);
  }

  /* --- NÚT BẤM --- */
  .btn-action {
    display: inline-block;
    padding: 12px 35px;
    background: linear-gradient(90deg, #2b5876, #4e4376);
    color: #fff;
    text-decoration: none;
    font-family: 'Orbitron', sans-serif;
    font-weight: bold;
    border-radius: 30px;
    border: 1px solid #7a6caa;
    box-shadow: 0 0 20px rgba(78, 67, 118, 0.6);
    transition: 0.3s;
  }
  .btn-action:hover {
    transform: scale(1.05);
    background: linear-gradient(90deg, #ff416c, #ff4b2b);
    box-shadow: 0 0 30px #ff4b2b;
    border-color: #ff4b2b;
  }

</style>
</head>
<body>

<div class="bg-container">
  <div class="background-image"></div>
  <div class="overlay"></div>
</div>

<div class="card">
  
  <div class="avatar-box">
    <img src="images/ha_van_tai.jpeg" class="avatar" alt="Avatar">
  </div>

  <div class="name">Hà Văn Tài</div>
  <div class="sub-title">Saiyan Warrior • Level 23</div>

  <div class="stats-container">
    <div class="stat-row"><span>HP (Sức Khỏe)</span><span>9894 / 10000</span></div>
    <div class="bar-bg"><div class="bar-fill hp-fill"></div></div>

    <div class="stat-row"><span>KI (Năng Lượng)</span><span>Vô Cực</span></div>
    <div class="bar-bg"><div class="bar-fill mp-fill"></div></div>
  </div>

  <div class="dragon-balls">
    <div class="ball">★</div>
    <div class="ball">★★</div>
    <div class="ball">★★★</div>
    <div class="ball">★★★★</div>
    <div class="ball">★★★★★</div>
    <div class="ball"><h6>6★</h6></div>
    <div class="ball"><h6>7★</h6></div>
  </div>

  <a href="#" class="btn-action">LIÊN HỆ NGAY</a>

  <div style="margin-top: 20px; font-size: 13px; color: #aaa;">
    <i class="fas fa-map-marker-alt"></i> Mục tiêu: Đài Loan 🇹🇼
  </div>

</div>

</body>
</html>
