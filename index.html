<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hà Văn Tài - Dragon Ball Legends</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    /* --- CÀI ĐẶT CHUNG --- */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: 'Montserrat', sans-serif;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: url('images/goku.jpg') no-repeat center center/cover;
        position: relative;
    }

    body::before {
        content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.4); z-index: -1;
    }

    /* =========================================
       1. HIỆU ỨNG VIỀN MÀN HÌNH (SÁNG - TỐI RÕ RÀNG)
       ========================================= */
    .mystic-border {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none; /* Để chuột bấm xuyên qua */
        z-index: 999; /* Nằm trên cùng */
        
        /* Animation Sáng - Tối */
        animation: deepBreath 4s infinite ease-in-out;
    }

    @keyframes deepBreath {
        0% {
            /* Tối: Viền mỏng, bóng nhỏ */
            box-shadow: inset 0 0 20px rgba(0, 234, 255, 0.2);
            border: 2px solid rgba(0, 234, 255, 0.2);
        }
        50% {
            /* Sáng Rực: Viền phát sáng mạnh, bóng tỏa vào trong */
            box-shadow: inset 0 0 100px rgba(0, 234, 255, 0.8);
            border: 4px solid rgba(0, 234, 255, 0.8);
        }
        100% {
            /* Quay lại Tối */
            box-shadow: inset 0 0 20px rgba(0, 234, 255, 0.2);
            border: 2px solid rgba(0, 234, 255, 0.2);
        }
    }

    /* =========================================
       2. KHUNG THẺ PROFILE (NHƯ CŨ - ỔN ĐỊNH)
       ========================================= */
    .profile-card {
        width: 500px;
        /* Màu nền tối (0.75) rõ ràng, dễ đọc chữ (Style cũ) */
        background: rgba(15, 23, 42, 0.75);
        backdrop-filter: blur(20px);
        border-radius: 35px;
        padding: 50px 40px;
        text-align: center;
        color: #fff;
        position: relative;
        
        /* Viền khung cũng thở theo nhịp */
        animation: borderPulse 4s infinite ease-in-out;
        
        margin-bottom: 180px; 
        z-index: 10;
    }

    @keyframes borderPulse {
        0% { border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 0 20px rgba(0, 180, 255, 0.1); }
        50% { border: 2px solid rgba(0, 234, 255, 0.8); box-shadow: 0 0 60px rgba(0, 180, 255, 0.5); }
        100% { border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 0 20px rgba(0, 180, 255, 0.1); }
    }

    /* =========================================
       3. AVATAR (NHƯ CŨ)
       ========================================= */
    .avatar-container { 
        position: relative; width: 220px; height: 220px; margin: 0 auto 30px auto; 
    }
    .avatar-border {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        border-radius: 50%; border: 4px solid #00eaff;
        box-shadow: 0 0 40px #00eaff; z-index: 2; 
        /* Avatar thở */
        animation: avatarBreath 4s infinite ease-in-out;
    }
    @keyframes avatarBreath {
        0% { box-shadow: 0 0 20px #00eaff; opacity: 0.6; }
        50% { box-shadow: 0 0 60px #00eaff; opacity: 1; }
        100% { box-shadow: 0 0 20px #00eaff; opacity: 0.6; }
    }
    
    .avatar { 
        width: 100%; height: 100%; border-radius: 50%; object-fit: cover; 
        position: relative; z-index: 3; border: 5px solid #fff;
    }

    /* TEXT & STATS */
    .name { font-family: 'Orbitron', sans-serif; font-size: 36px; font-weight: 700; margin-bottom: 5px; text-transform: uppercase; text-shadow: 0 0 10px rgba(0, 234, 255, 0.8); }
    .title { color: #00eaff; font-size: 15px; letter-spacing: 3px; margin-bottom: 25px; text-transform: uppercase; font-weight: 600; }
    
    .stats-grid { display: flex; justify-content: space-between; background: rgba(255,255,255,0.07); padding: 15px; border-radius: 20px; margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.1); }
    .stat-item { text-align: center; width: 25%; }
    .stat-label { font-size: 11px; color: #aaa; font-weight: 600; display: block; margin-bottom: 5px; }
    .stat-value { font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 700; color: #fff; }
    .age-val { color: #ff9900; }

    /* CONTACT */
    .contact-info { margin-bottom: 25px; text-align: left; padding: 0 10px; }
    .contact-row { display: flex; align-items: center; background: rgba(0, 10, 20, 0.6); margin-bottom: 10px; padding: 12px; border-radius: 12px; border: 1px solid rgba(0, 234, 255, 0.1); transition: 0.3s; }
    .contact-row:hover { background: rgba(0, 234, 255, 0.15); border-color: #00eaff; }
    .contact-row i { font-size: 20px; color: #00eaff; width: 40px; text-align: center; }
    .contact-text { font-size: 15px; font-weight: 600; letter-spacing: 0.5px; }

    .btn-activate {
        display: block; width: 100%; padding: 15px;
        background: linear-gradient(90deg, #3a4b8a, #5f72bd); color: #fff;
        text-decoration: none; font-weight: 700; font-size: 16px;
        border-radius: 50px; text-transform: uppercase; cursor: pointer;
        box-shadow: 0 0 25px rgba(95, 114, 189, 0.6); transition: 0.3s; font-family: 'Orbitron', sans-serif;
    }
    .btn-activate:hover { transform: scale(1.03); box-shadow: 0 0 50px rgba(95, 114, 189, 0.9); }

    /* NGỌC RỒNG */
    .dragon-balls-container {
        position: absolute; bottom: 30px; z-index: 20;
        display: grid; grid-template-columns: repeat(12, 1fr); gap: 15px; width: 600px;
        transform: translateY(20px); 
    }
    .dragon-ball {
        width: 90px; height: 90px; border-radius: 50%;
        background: radial-gradient(circle at 40% 40%, #fff5cc 0%, #ffac00 45%, #d95700 100%);
        box-shadow: inset 5px 5px 20px rgba(255,255,255,0.7), inset -5px -5px 15px rgba(0,0,0,0.5), 0 10px 20px rgba(0,0,0,0.6);
        position: relative; transition: 0.3s; cursor: pointer;
    }
    .dragon-ball::after {
        content: ''; position: absolute; top: 8%; left: 8%; width: 40%; height: 25%; border-radius: 50%;
        background: linear-gradient(135deg, rgba(255,255,255,0.8), rgba(255,255,255,0.1));
        filter: blur(2px); transform: rotate(-45deg);
    }
    .dragon-ball:hover { transform: scale(1.1) translateY(-10px) !important; filter: brightness(1.15); }

    /* Vị trí Ngọc */
    #db-5 { grid-column: 3 / 5; grid-row: 1; } 
    #db-1 { grid-column: 6 / 8; grid-row: 1; transform: translateY(-25px); } 
    #db-2 { grid-column: 9 / 11; grid-row: 1; } 
    #db-6 { grid-column: 1 / 3; grid-row: 2; transform: translateY(10px); }
    #db-3 { grid-column: 4 / 6; grid-row: 2; }
    #db-4 { grid-column: 8 / 10; grid-row: 2; }
    #db-7 { grid-column: 11 / 13; grid-row: 2; transform: translateY(10px); }

    /* Ngôi sao */
    .star { position: absolute; color: #d11a00; font-size: 15px; filter: drop-shadow(0 1px 0 rgba(255,255,255,0.3)); top: 50%; left: 50%; transform: translate(-50%, -50%); width: 15px; height: 15px; line-height: 15px; text-align: center; }
    #db-1 .star { font-size: 35px; width: auto; height: auto; }
    #db-2 .s1 { transform: translate(calc(-50% - 14px), -50%); } #db-2 .s2 { transform: translate(calc(-50% + 14px), -50%); }
    #db-3 .s1 { transform: translate(-50%, calc(-50% - 18px)); } #db-3 .s2 { transform: translate(calc(-50% - 16px), calc(-50% + 10px)); } #db-3 .s3 { transform: translate(calc(-50% + 16px), calc(-50% + 10px)); }
    #db-4 .s1 { transform: translate(-50%, calc(-50% - 20px)); } #db-4 .s2 { transform: translate(-50%, calc(-50% + 20px)); } #db-4 .s3 { transform: translate(calc(-50% - 20px), -50%); } #db-4 .s4 { transform: translate(calc(-50% + 20px), -50%); }
    #db-5 .s1 { transform: translate(-50%, calc(-50% - 22px)); } #db-5 .s2 { transform: translate(calc(-50% - 21px), calc(-50% - 6px)); } #db-5 .s3 { transform: translate(calc(-50% + 21px), calc(-50% - 6px)); } #db-5 .s4 { transform: translate(calc(-50% - 13px), calc(-50% + 18px)); } #db-5 .s5 { transform: translate(calc(-50% + 13px), calc(-50% + 18px)); }
    #db-6 .s1 { transform: translate(-50%, calc(-50% - 23px)); } #db-6 .s2 { transform: translate(-50%, calc(-50% + 23px)); } #db-6 .s3 { transform: translate(calc(-50% - 20px), calc(-50% - 11px)); } #db-6 .s4 { transform: translate(calc(-50% + 20px), calc(-50% - 11px)); } #db-6 .s5 { transform: translate(calc(-50% - 20px), calc(-50% + 11px)); } #db-6 .s6 { transform: translate(calc(-50% + 20px), calc(-50% + 11px)); }
    #db-7 .s1 { transform: translate(-50%, -50%); font-size: 18px; } #db-7 .s2 { transform: translate(-50%, calc(-50% - 24px)); } #db-7 .s3 { transform: translate(-50%, calc(-50% + 24px)); } #db-7 .s4 { transform: translate(calc(-50% - 21px), calc(-50% - 12px)); } #db-7 .s5 { transform: translate(calc(-50% + 21px), calc(-50% - 12px)); } #db-7 .s6 { transform: translate(calc(-50% - 21px), calc(-50% + 12px)); } #db-7 .s7 { transform: translate(calc(-50% + 21px), calc(-50% + 12px)); }

    /* POPUP ẢNH LỚN */
    .qr-modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); justify-content: center; align-items: center; backdrop-filter: blur(8px); animation: fadeIn 0.3s; }
    @keyframes fadeIn { from {opacity: 0;} to {opacity: 1;} }
    
    .qr-content { 
        position: relative; background: #fff; padding: 1px; border-radius: 12px; 
        box-shadow: 0 0 50px #00eaff; animation: zoomIn 0.3s; text-align: center;
        width: auto; max-width: 95%;
    }
    @keyframes zoomIn { from {transform: scale(0.5);} to {transform: scale(1);} }

    .qr-img { width: 800px; max-width: 95vw; height: auto; max-height: 85vh; object-fit: contain; border-radius: 10px; display: block; margin: 0 auto; }
    .close-btn { position: absolute; top: -20px; right: -20px; background: #ff3333; color: white; width: 40px; height: 40px; border-radius: 50%; text-align: center; line-height: 40px; font-weight: bold; font-size: 24px; cursor: pointer; border: 3px solid #fff; box-shadow: 0 0 15px rgba(0,0,0,0.5); z-index: 101; }
    .close-btn:hover { background: red; transform: scale(1.1); }
    .scan-text { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); font-family: 'Orbitron', sans-serif; font-weight: bold; color: #fff; font-size: 18px; text-shadow: 0 0 5px #000; pointer-events: none; }

</style>
</head>
<body>

    <div class="mystic-border"></div>

    <div class="profile-card">
        <div class="avatar-container">
            <div class="avatar-border"></div>
            <img src="images/ha_van_tai.jpeg" class="avatar" alt="Avatar">
        </div>
        <div class="name">Hà Văn Tài</div>
        <div class="title">Saiyan Warrior • Ultra Instinct</div>
        <div class="stats-grid">
            <div class="stat-item"><span class="stat-label">TUỔI</span><span class="stat-value age-val">23</span></div>
            <div class="stat-item"><span class="stat-label">SỨC MẠNH</span><span class="stat-value">9999</span></div>
            <div class="stat-item"><span class="stat-label">QUỐC GIA</span><span class="stat-value">VN</span></div>
            <div class="stat-item"><span class="stat-label">STATUS</span><span class="stat-value">FA</span></div>
        </div>
        <div class="contact-info">
            <div class="contact-row"><i class="fas fa-phone-alt"></i><span class="contact-text">0970.622.189</span></div>
            <div class="contact-row"><i class="fas fa-envelope"></i><span class="contact-text">taipluss@gmail.com</span></div>
        </div>
        
        <a class="btn-activate" onclick="openQR()">KẾT BẠN NGAY</a>
    </div>

    <div class="dragon-balls-container">
        <div class="dragon-ball db-5" id="db-5" onclick="showBall(5, 'NGŨ TINH NGỌC')"><span class="star s1">★</span><span class="star s2">★</span><span class="star s3">★</span><span class="star s4">★</span><span class="star s5">★</span></div>
        <div class="dragon-ball db-1" id="db-1" onclick="showBall(1, 'NHẤT TINH NGỌC')"><span class="star">★</span></div>
        <div class="dragon-ball db-2" id="db-2" onclick="showBall(2, 'NHỊ TINH NGỌC')"><span class="star s1">★</span><span class="star s2">★</span></div>
        <div class="dragon-ball db-6" id="db-6" onclick="showBall(6, 'LỤC TINH NGỌC')"><span class="star s1">★</span><span class="star s2">★</span><span class="star s3">★</span><span class="star s4">★</span><span class="star s5">★</span><span class="star s6">★</span></div>
        <div class="dragon-ball db-3" id="db-3" onclick="showBall(3, 'TAM TINH NGỌC')"><span class="star s1">★</span><span class="star s2">★</span><span class="star s3">★</span></div>
        <div class="dragon-ball db-4" id="db-4" onclick="showBall(4, 'TỨ TINH NGỌC')"><span class="star s1">★</span><span class="star s2">★</span><span class="star s3">★</span><span class="star s4">★</span></div>
        <div class="dragon-ball db-7" id="db-7" onclick="showBall(7, 'THẤT TINH NGỌC')"><span class="star s1">★</span><span class="star s2">★</span><span class="star s3">★</span><span class="star s4">★</span><span class="star s5">★</span><span class="star s6">★</span><span class="star s7">★</span></div>
    </div>

    <div id="qrPopup" class="qr-modal" onclick="closeQR()">
        <div class="qr-content" onclick="event.stopPropagation()">
            <div class="close-btn" onclick="closeQR()">×</div>
            <img src="images/qr_code.jpeg" id="popup-image" class="qr-img" alt="Popup Image">
            <div class="scan-text" id="popup-text">SCAN ME</div>
        </div>
    </div>

    <script>
        function openQR() {
            document.getElementById("popup-image").src = "images/qr_code.jpeg";
            document.getElementById("popup-text").innerText = "QUÉT MÃ ĐỂ KẾT BẠN";
            document.getElementById("qrPopup").style.display = "flex";
        }
        function showBall(num, name) {
            document.getElementById("popup-image").src = "images/b" + num + ".jpeg";
            document.getElementById("popup-text").innerText = name;
            document.getElementById("qrPopup").style.display = "flex";
        }
        function closeQR() { document.getElementById("qrPopup").style.display = "none"; }
    </script>

</body>
</html>
