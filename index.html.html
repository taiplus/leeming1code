<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>個人頁面</title>
<style>
  body {
    font-family: sans-serif;
    background: #f0f2f5;
    margin: 0;
    padding: 0;
  }
  .mobile-header {
    background: #1877f2;
    color: #fff;
    padding: 14px;
    font-size: 20px;
    font-weight: bold;
    text-align: center;
  }
  .profile {
    background: #fff;
    padding: 20px;
    text-align: center;
    position: relative;
  }
  .cover-photo {
    width: 100%;
    height: 180px;
    background: url('imagesnew/ha_van_tai.jpeg') center/cover;
    filter: brightness(0.7);
    position: relative;
  }
  .avatar {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #1877f2;
    box-shadow: 0 0 15px #00eaff, 0 0 30px #00eaff;
    position: absolute;
    left: 50%;
    top: 130px;
    transform: translateX(-50%);
    border: 4px solid #fff;
    /* tắt cursor pointer */
    cursor: default;
  }
  .name {
    font-size: 22px;
    font-weight: bold;
    margin-top: 70px;
  }
  .meta {
    color: #555;
    margin-top: 4px;
  }
  .section {
    background: #fff;
    margin-top: 12px;
    padding: 16px;
    border-radius: 8px;
  }
  .section h3 {
    margin: 0 0 10px 0;
  }
</style>
</head>
<body>

<div class="mobile-header">個人主頁</div>

<div class="profile">
  <!-- Cover photo -->
  <div class="cover-photo" id="coverPhoto"></div>

  <!-- Avatar (không click được nữa) -->
  <img src="imagesnew/ha_van_tai.jpeg" class="avatar" id="avatar" />

  <div style="text-align:center;">
    <div class="name">何文財（HA VAN TAI）</div>
    <div class="meta">23歲｜越南｜男</div>
  </div>
</div>

<div class="section">
  <h3>聯絡方式</h3>
  📞 電話：0970622189<br>
  📧 Email：taipluss@gmail.com
</div>

<div class="section">
  <h3>興趣</h3>
  玩遊戲、探索新事物
</div>

<div class="section">
  <h3>想體驗</h3>
  台灣美食、旅遊文化
</div>

<div class="section">
  <h3>個人照片</h3>
  <img src="imagesnew/ha_van_tai.jpeg" style="width:100%; border-radius:12px;" />
</div>

</body>
</html>
